[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimirbench"
version = "0.2.0"
description = "Evaluating and interpreting strategic reasoning in language-model agents under uncertainty."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Anannye Naik" }]
keywords = [
    "llm",
    "evaluation",
    "agents",
    "mechanistic-interpretability",
    "bayesian-reasoning",
    "decision-making",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
ml = [
    "torch>=2.2",
    "transformers>=4.40",
]
plots = [
    "matplotlib>=3.8",
]
api = [
    "openai>=1.0",
    "anthropic>=0.40",
    "google-genai>=2.0",
]

[project.scripts]
mimirbench = "mimirbench.cli:app"

[project.urls]
Homepage = "https://github.com/anannyenaik/MimirBench"
Repository = "https://github.com/anannyenaik/MimirBench"
Documentation = "https://github.com/anannyenaik/MimirBench#readme"
Issues = "https://github.com/anannyenaik/MimirBench/issues"

[tool.hatch.build.targets.wheel]
packages = ["mimirbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"mimirbench/cli.py" = ["B008"]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["mimirbench"]

[tool.mypy]
files = ["mimirbench"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "torch.*",
    "transformers.*",
    "openai.*",
    "anthropic.*",
    "google.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"

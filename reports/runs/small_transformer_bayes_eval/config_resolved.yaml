run:
  name: small_transformer_bayes_eval
  seed: 10000
  output_dir: reports/runs/small_transformer_bayes_eval
checkpoint_path: reports/training/small_transformer_bayes_tiny/checkpoints/best.pt
device: cpu
data:
  num_tasks: 128
  num_hypotheses: 2
  min_observations: 1
  max_observations: 6
  signal_reliability: 0.7
  posterior_buckets: 20
  payoff:
    reward_if_A: 1.0
    loss_if_not_A: 1.0
    decision_cost: 0.0
    risk_tolerance: 0.35

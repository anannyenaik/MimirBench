run:
  name: small_transformer_bayes_medium_seed_127
  seed: 127
  output_dir: reports/training/small_transformer_bayes_medium_seed_127
data:
  num_train: 12000
  num_val: 2000
  num_test: 2000
  seed: 127
  num_hypotheses: 2
  min_observations: 2
  max_observations: 10
  signal_reliability: 0.75
  posterior_buckets: 20
  payoff:
    reward_if_A: 1.0
    loss_if_not_A: 1.0
    decision_cost: 0.0
    risk_tolerance: 0.35
model:
  d_model: 128
  n_layers: 2
  n_heads: 4
  dim_feedforward: 256
  dropout: 0.0
  max_seq_len: 128
  lm_loss_weight: 0.0
training:
  batch_size: 64
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  device: cpu
  early_stopping_patience: 5

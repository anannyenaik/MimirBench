  seed: 123
  output_dir: reports/runs/all_reference_smoke
  cache: true
  max_workers: 1

agent:
  type: reference

environments:
  - name: bayesian_games
    num_tasks: 20
    seed: 123
  - name: auctions
    num_tasks: 20

# Planned full track A, best-valid hosted-model leaderboard.
# This file makes paid calls only when explicitly passed to run-leaderboard with
# --allow-real-models. It is never run by tests. Status: implemented, not run.
run:
  name: leaderboard_best_valid_100env_3seeds
  seed: 123
  output_dir: reports/runs/leaderboard/leaderboard_best_valid_100env_3seeds
  cache: true
  max_workers: 1
protocol:
  track: best-valid
  scale: full-a
  tasks_per_environment: 100
  task_seeds: [123, 1123, 2123]
  execution_status: planned_not_run
models:
  - name: openai_gpt_5_4_best_valid_full
    provider: openai
    model: gpt-5.4
    api_key_env: OPENAI_API_KEY
    temperature: 0
    max_tokens: 512
    max_retries: 3
    timeout_seconds: 60
    pricing: {input_usd_per_1m: 2.50, output_usd_per_1m: 15.00}
  - name: anthropic_claude_sonnet_4_6_best_valid_full
    provider: anthropic
    model: claude-sonnet-4-6
    api_key_env: ANTHROPIC_API_KEY
    temperature: 0
    max_tokens: 1536
    max_retries: 3
    timeout_seconds: 60
    pricing: {input_usd_per_1m: 3.00, output_usd_per_1m: 15.00}
  - name: gemini_3_5_flash_best_valid_full
    provider: gemini
    model: gemini-3.5-flash
    api_key_env: GEMINI_API_KEY
    temperature: 1
    request_extra:
      use_default_temperature: true
      thinking_config: {thinking_budget: 0}
    max_tokens: 512
    max_retries: 3
    timeout_seconds: 60
    pricing: {input_usd_per_1m: 1.50, output_usd_per_1m: 9.00}
  - name: gemini_3_1_pro_preview_best_valid_full
    provider: gemini
    model: gemini-3.1-pro-preview
    api_key_env: GEMINI_API_KEY
    temperature: 1
    request_extra:
      use_default_temperature: true
      thinking_config: {thinking_level: low}
    max_tokens: 4096
    max_retries: 3
    timeout_seconds: 120
    pricing: {input_usd_per_1m: 2.00, output_usd_per_1m: 12.00}
agents: [direct]
environments:
  - {name: bayesian_games, num_tasks: 100, seed: 123}
  - {name: auctions, num_tasks: 100, seed: 123}
  - {name: hidden_regimes, num_tasks: 100, seed: 123}
  - {name: market_making, num_tasks: 100, seed: 123}
  - {name: prediction_markets, num_tasks: 100, seed: 123}
  - {name: adversarial_risk, num_tasks: 100, seed: 123}
  - {name: bayesian_games, num_tasks: 100, seed: 1123}
  - {name: auctions, num_tasks: 100, seed: 1123}
  - {name: hidden_regimes, num_tasks: 100, seed: 1123}
  - {name: market_making, num_tasks: 100, seed: 1123}
  - {name: prediction_markets, num_tasks: 100, seed: 1123}
  - {name: adversarial_risk, num_tasks: 100, seed: 1123}
  - {name: bayesian_games, num_tasks: 100, seed: 2123}
  - {name: auctions, num_tasks: 100, seed: 2123}
  - {name: hidden_regimes, num_tasks: 100, seed: 2123}
  - {name: market_making, num_tasks: 100, seed: 2123}
  - {name: prediction_markets, num_tasks: 100, seed: 2123}
  - {name: adversarial_risk, num_tasks: 100, seed: 2123}
robustness: {enabled: false}
reporting: {write_jsonl: true, write_summary: true, write_markdown: true}

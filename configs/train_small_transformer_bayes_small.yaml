run:
  name: small_transformer_bayes_small
  seed: 123
  output_dir: reports/training/small_transformer_bayes_small

data:
  num_train: 2048
  num_val: 512
  num_test: 512
  min_observations: 1
  max_observations: 8
  num_hypotheses: 2
  signal_reliability: 0.72
  posterior_buckets: 20
  payoff:
    reward_if_A: 1.0
    loss_if_not_A: 1.0
    decision_cost: 0.0
    risk_tolerance: 0.35

model:
  d_model: 64
  n_layers: 2
  n_heads: 2
  dim_feedforward: 128
  dropout: 0.05
  max_seq_len: 128
  lm_loss_weight: 0.0

training:
  batch_size: 64
  epochs: 8
  learning_rate: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  device: auto
  early_stopping_patience: 3

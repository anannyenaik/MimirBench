# Paired real OpenAI gpt-5.4-mini direct-vs-tool leaderboard.
#
# Running this makes paid API calls. Scope (PRELIMINARY): one cheap modern OpenAI
# mini model, two agent modes (direct, tool), two calculation-heavy environments
# (bayesian_games, prediction_markets), twenty-five tasks per environment, no
# robustness. Both agent modes run on identical task IDs/seeds so direct-vs-tool
# deltas are paired. Task count was set to 25/env (down from a planned 50) to keep
# the estimated cost upper bound under the $0.75 budget guard. Goal: test whether
# tool use helps calculation-heavy strategic reasoning, and whether any
# Bayesian-updating gains transfer to prediction-market decisions. These are
# benchmark diagnostics only - not a claim about trading usefulness or broad model
# superiority.
run:
  name: leaderboard_openai_gpt54mini_bayes_pred_direct_tool_25
  seed: 123
  output_dir: reports/runs/leaderboard/leaderboard_openai_gpt54mini_bayes_pred_direct_tool_25
  cache: true
  max_workers: 1
models:
  - name: openai_gpt_5_4_mini_bayes_pred_25
    provider: openai
    model: gpt-5.4-mini
    api_key_env: OPENAI_API_KEY
    temperature: 0
    max_tokens: 512
    max_retries: 3
    timeout_seconds: 60
    pricing:
      input_usd_per_1m: 0.75
      output_usd_per_1m: 4.50
agents:
  - direct
  - tool
environments:
  - name: bayesian_games
    num_tasks: 25
    seed: 123
  - name: prediction_markets
    num_tasks: 25
    seed: 123
robustness:
  enabled: false
reporting:
  write_jsonl: true
  write_summary: true
  write_markdown: true

# Gemini Flash direct-agent 20/env row across all environments.
#
# Current stable model: gemini-3.5-flash. Pricing is Gemini Developer API
# Standard text pricing in USD per 1M tokens; output pricing includes thinking
# tokens. Uses the same seed/task IDs as the OpenAI and Claude 20/env ladders.
run:
  name: leaderboard_gemini_flash_all_envs_direct_20
  seed: 123
  output_dir: reports/runs/leaderboard/leaderboard_gemini_flash_all_envs_direct_20
  cache: true
  max_workers: 1
models:
  - name: gemini_3_5_flash_direct_all_envs_20
    provider: gemini
    model: gemini-3.5-flash
    api_key_env: GEMINI_API_KEY
    temperature: 1
    request_extra:
      use_default_temperature: true
    max_tokens: 512
    max_retries: 3
    timeout_seconds: 60
    pricing:
      input_usd_per_1m: 1.50
      output_usd_per_1m: 9.00
agents:
  - direct
environments:
  - name: bayesian_games
    num_tasks: 20
    seed: 123
  - name: auctions
    num_tasks: 20
    seed: 123
  - name: hidden_regimes
    num_tasks: 20
    seed: 123
  - name: market_making
    num_tasks: 20
    seed: 123
  - name: prediction_markets
    num_tasks: 20
    seed: 123
  - name: adversarial_risk
    num_tasks: 20
    seed: 123
robustness:
  enabled: false
reporting:
  write_jsonl: true
  write_summary: true
  write_markdown: true

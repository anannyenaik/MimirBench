# Gemini Flash rescue probe: disable thinking to avoid max-output truncation.
#
# The first gemini-3.5-flash 20/env row hit MAX_TOKENS on nearly every task at
# max_tokens=512 because output tokens include hidden thinking tokens. This tiny
# probe tests whether thinking_budget=0 restores clean JSON without raising the
# output budget.
run:
  name: leaderboard_gemini_flash_rescue_probe_thinking0
  seed: 123
  output_dir: reports/runs/leaderboard/leaderboard_gemini_flash_rescue_probe_thinking0
  cache: true
  max_workers: 1
models:
  - name: gemini_3_5_flash_direct_probe_thinking0
    provider: gemini
    model: gemini-3.5-flash
    api_key_env: GEMINI_API_KEY
    temperature: 1
    request_extra:
      use_default_temperature: true
      thinking_config:
        thinking_budget: 0
    max_tokens: 512
    max_retries: 3
    timeout_seconds: 60
    pricing:
      input_usd_per_1m: 1.50
      output_usd_per_1m: 9.00
agents:
  - direct
environments:
  - name: bayesian_games
    num_tasks: 1
    seed: 123
  - name: auctions
    num_tasks: 1
    seed: 123
  - name: hidden_regimes
    num_tasks: 1
    seed: 123
  - name: market_making
    num_tasks: 1
    seed: 123
  - name: prediction_markets
    num_tasks: 1
    seed: 123
  - name: adversarial_risk
    num_tasks: 1
    seed: 123
robustness:
  enabled: false
reporting:
  write_jsonl: true
  write_summary: true
  write_markdown: true

# Cache-backed retry of the Gemini 3.1 Pro Preview 20/env row.
#
# The first full run completed 106/120 model calls and failed 14 tasks with
# transient provider 503/504 errors. A stopped retry cache contains 7 additional
# successful responses for those original misses. This run preloads a combined
# cache so only the remaining missing tasks call Gemini.
run:
  name: leaderboard_gemini_pro_all_envs_direct_20_retry
  seed: 123
  output_dir: reports/runs/leaderboard/leaderboard_gemini_pro_all_envs_direct_20_retry
  cache: true
  cache_path: reports/runs/leaderboard/leaderboard_gemini_pro_all_envs_direct_20_retry/models/gemini_3_1_pro_preview_direct_all_envs_20/agents/direct/responses_cache.jsonl
  max_workers: 1
models:
  - name: gemini_3_1_pro_preview_direct_all_envs_20
    provider: gemini
    model: gemini-3.1-pro-preview
    api_key_env: GEMINI_API_KEY
    temperature: 1
    request_extra:
      use_default_temperature: true
      thinking_config:
        thinking_level: low
    max_tokens: 4096
    max_retries: 3
    timeout_seconds: 120
    pricing:
      input_usd_per_1m: 2.00
      output_usd_per_1m: 12.00
agents:
  - direct
environments:
  - name: bayesian_games
    num_tasks: 20
    seed: 123
  - name: auctions
    num_tasks: 20
    seed: 123
  - name: hidden_regimes
    num_tasks: 20
    seed: 123
  - name: market_making
    num_tasks: 20
    seed: 123
  - name: prediction_markets
    num_tasks: 20
    seed: 123
  - name: adversarial_risk
    num_tasks: 20
    seed: 123
robustness:
  enabled: false
reporting:
  write_jsonl: true
  write_summary: true
  write_markdown: true

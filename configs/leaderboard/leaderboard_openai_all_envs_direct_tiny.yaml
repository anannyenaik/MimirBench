# Tiny real OpenAI leaderboard across all environments.
#
# Running this makes paid API calls. It is intentionally scoped as a preliminary
# artefact: one cheap OpenAI model, one direct agent, six environments, five
# tasks per environment, no robustness.
run:
  name: leaderboard_openai_all_envs_direct_tiny
  seed: 123
  output_dir: reports/runs/leaderboard/leaderboard_openai_all_envs_direct_tiny
  cache: true
  max_workers: 1
models:
  - name: openai_gpt_4_1_mini_direct_all_envs_tiny
    provider: openai
    model: gpt-4.1-mini
    api_key_env: OPENAI_API_KEY
    temperature: 0
    max_tokens: 512
    max_retries: 3
    timeout_seconds: 60
    pricing:
      input_usd_per_1m: 0.40
      output_usd_per_1m: 1.60
agents:
  - direct
environments:
  - name: bayesian_games
    num_tasks: 5
    seed: 123
  - name: auctions
    num_tasks: 5
    seed: 123
  - name: hidden_regimes
    num_tasks: 5
    seed: 123
  - name: market_making
    num_tasks: 5
    seed: 123
  - name: prediction_markets
    num_tasks: 5
    seed: 123
  - name: adversarial_risk
    num_tasks: 5
    seed: 123
robustness:
  enabled: false
reporting:
  write_jsonl: true
  write_summary: true
  write_markdown: true

# Rescued gpt-5.5 OpenAI direct-agent ladder row.
#
# This uses the same task IDs/seeds as leaderboard_openai_gpt55_all_envs_direct_20
# but changes the API configuration after the rescue probe: temperature is
# omitted by the client, max_completion_tokens is larger, and Chat Completions
# reasoning_effort is set to low. This weakens strict comparability with earlier
# OpenAI ladder rows and must be reported as preliminary.
run:
  name: leaderboard_openai_gpt55_all_envs_direct_20_rescued
  seed: 123
  output_dir: reports/runs/leaderboard/leaderboard_openai_gpt55_all_envs_direct_20_rescued
  cache: true
  max_workers: 1
models:
  - name: openai_gpt_5_5_direct_all_envs_20_rescued
    provider: openai
    model: gpt-5.5
    api_key_env: OPENAI_API_KEY
    temperature: 0
    max_tokens: 2048
    max_retries: 3
    timeout_seconds: 60
    request_extra:
      reasoning_effort: low
    pricing:
      input_usd_per_1m: 5.00
      output_usd_per_1m: 30.00
agents:
  - direct
environments:
  - name: bayesian_games
    num_tasks: 20
    seed: 123
  - name: auctions
    num_tasks: 20
    seed: 123
  - name: hidden_regimes
    num_tasks: 20
    seed: 123
  - name: market_making
    num_tasks: 20
    seed: 123
  - name: prediction_markets
    num_tasks: 20
    seed: 123
  - name: adversarial_risk
    num_tasks: 20
    seed: 123
robustness:
  enabled: false
reporting:
  write_jsonl: true
  write_summary: true
  write_markdown: true

# Diagnostic higher-output-budget probe for Claude Sonnet 4.6.
#
# The full 20/env Sonnet direct run (max_tokens=512) had a 59% parse-failure
# rate: 70/120 responses hit finish_reason="max_tokens" while still writing a
# natural-language reasoning preamble, so no JSON object was emitted before the
# cutoff ("no_json_object"). Haiku 4.5 and gpt-5.4 stayed concise under the same
# default prompt and parsed cleanly, so this is a Sonnet-specific verbosity /
# output-budget interaction, not a confirmed capability result.
#
# This probe reruns a 5-task-per-environment slice (the first 5 task IDs of the
# same seed-123 schedule, so they pair directly with the truncated run) with the
# ONLY change being a larger output budget (max_tokens=1024). The prompt,
# temperature, seeds, and task IDs are otherwise identical, isolating "score when
# not truncated" from "protocol fit". It mirrors the OpenAI gpt-5.5 rescue probe.
run:
  name: leaderboard_claude_sonnet_rescue_probe_1024
  seed: 123
  output_dir: reports/runs/leaderboard/leaderboard_claude_sonnet_rescue_probe_1024
  cache: true
  max_workers: 1
models:
  - name: anthropic_claude_sonnet_4_6_direct_probe_1024
    provider: anthropic
    model: claude-sonnet-4-6
    api_key_env: ANTHROPIC_API_KEY
    temperature: 0
    max_tokens: 1024
    max_retries: 3
    timeout_seconds: 60
    pricing:
      input_usd_per_1m: 3.00
      output_usd_per_1m: 15.00
agents:
  - direct
environments:
  - name: bayesian_games
    num_tasks: 5
    seed: 123
  - name: auctions
    num_tasks: 5
    seed: 123
  - name: hidden_regimes
    num_tasks: 5
    seed: 123
  - name: market_making
    num_tasks: 5
    seed: 123
  - name: prediction_markets
    num_tasks: 5
    seed: 123
  - name: adversarial_risk
    num_tasks: 5
    seed: 123
robustness:
  enabled: false
reporting:
  write_jsonl: true
  write_summary: true
  write_markdown: true

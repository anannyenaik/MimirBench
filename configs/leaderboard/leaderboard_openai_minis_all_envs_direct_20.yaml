# Paired real OpenAI mini leaderboard across all environments.
#
# Running this makes paid API calls. It is intentionally scoped as a preliminary
# paired expansion of the five-task all-environment direct runs: two cheap
# OpenAI mini models, one direct agent, six environments, twenty tasks per
# environment, no robustness.
run:
  name: leaderboard_openai_minis_all_envs_direct_20
  seed: 123
  output_dir: reports/runs/leaderboard/leaderboard_openai_minis_all_envs_direct_20
  cache: true
  max_workers: 1
models:
  - name: openai_gpt_4_1_mini_direct_all_envs_20
    provider: openai
    model: gpt-4.1-mini
    api_key_env: OPENAI_API_KEY
    temperature: 0
    max_tokens: 512
    max_retries: 3
    timeout_seconds: 60
    pricing:
      input_usd_per_1m: 0.40
      output_usd_per_1m: 1.60
  - name: openai_gpt_5_4_mini_direct_all_envs_20
    provider: openai
    model: gpt-5.4-mini
    api_key_env: OPENAI_API_KEY
    temperature: 0
    max_tokens: 512
    max_retries: 3
    timeout_seconds: 60
    pricing:
      input_usd_per_1m: 0.75
      output_usd_per_1m: 4.50
agents:
  - direct
environments:
  - name: bayesian_games
    num_tasks: 20
    seed: 123
  - name: auctions
    num_tasks: 20
    seed: 123
  - name: hidden_regimes
    num_tasks: 20
    seed: 123
  - name: market_making
    num_tasks: 20
    seed: 123
  - name: prediction_markets
    num_tasks: 20
    seed: 123
  - name: adversarial_risk
    num_tasks: 20
    seed: 123
robustness:
  enabled: false
reporting:
  write_jsonl: true
  write_summary: true
  write_markdown: true

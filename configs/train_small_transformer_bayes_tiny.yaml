run:
  name: small_transformer_bayes_tiny
  seed: 123
  output_dir: reports/training/small_transformer_bayes_tiny

data:
  num_train: 128
  num_val: 32
  num_test: 32
  min_observations: 1
  max_observations: 6
  num_hypotheses: 2
  signal_reliability: 0.7
  posterior_buckets: 20
  payoff:
    reward_if_A: 1.0
    loss_if_not_A: 1.0
    decision_cost: 0.0
    risk_tolerance: 0.35

model:
  d_model: 32
  n_layers: 1
  n_heads: 2
  dim_feedforward: 64
  dropout: 0.0
  max_seq_len: 128
  lm_loss_weight: 0.0

training:
  batch_size: 32
  epochs: 2
  learning_rate: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  device: cpu

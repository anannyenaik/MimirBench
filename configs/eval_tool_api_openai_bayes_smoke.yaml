# Tiny model-backed tool-using smoke benchmark on Bayesian-updating tasks.
#
# Requires the 'api' extra and OPENAI_API_KEY. NOT run by the test suite; running
# it makes paid API calls (up to tool_max_steps + 1 completions per task). The
# model proposes JSON tool calls that are validated against the environment
# allow-list before being executed deterministically; every step is written to
# the tool-use audit log.
run:
  name: tool_api_openai_bayes_smoke
  seed: 123
  output_dir: reports/runs/tool_api_openai_bayes_smoke
  cache: true
  max_workers: 1

agent:
  type: tool
  tool_policy: model
  provider: openai
  model: gpt-4.1-mini
  temperature: 0
  max_retries: 3
  timeout_seconds: 60
  max_tokens: 512
  tool_max_steps: 3

environments:
  - name: bayesian_games
    num_tasks: 10
    seed: 123

reporting:
  write_jsonl: true
  write_summary: true
  write_markdown: true

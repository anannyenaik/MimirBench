# Selected hosted-model benchmark. Running this configuration makes paid API calls.
run:
  name: hosted_pilot
  seed: 123
  output_dir: runs/hosted_pilot
  cache: true
  max_workers: 1

protocol:
  track: mixed-selected
  scale: pilot
  tasks_per_environment: 20
  task_seeds: [123]

models:
  - name: openai_gpt_4_1_mini
    provider: openai
    model: gpt-4.1-mini
    api_key_env: OPENAI_API_KEY
    temperature: 0
    max_tokens: 512
    max_retries: 3
    timeout_seconds: 60
  - name: openai_gpt_5_4_mini
    provider: openai
    model: gpt-5.4-mini
    api_key_env: OPENAI_API_KEY
    temperature: 0
    max_tokens: 512
    max_retries: 3
    timeout_seconds: 60
  - name: openai_gpt_5_4
    provider: openai
    model: gpt-5.4
    api_key_env: OPENAI_API_KEY
    temperature: 0
    max_tokens: 512
    max_retries: 3
    timeout_seconds: 60
  - name: claude_haiku_4_5
    provider: anthropic
    model: claude-haiku-4-5-20251001
    api_key_env: ANTHROPIC_API_KEY
    temperature: 0
    max_tokens: 512
    max_retries: 3
    timeout_seconds: 60
  - name: claude_sonnet_4_6
    provider: anthropic
    model: claude-sonnet-4-6
    api_key_env: ANTHROPIC_API_KEY
    temperature: 0
    max_tokens: 1536
    max_retries: 3
    timeout_seconds: 60
  - name: gemini_flash_lite
    provider: gemini
    model: gemini-3.1-flash-lite
    api_key_env: GEMINI_API_KEY
    temperature: 1
    request_extra: {use_default_temperature: true}
    max_tokens: 512
    max_retries: 3
    timeout_seconds: 60
  - name: gemini_flash
    provider: gemini
    model: gemini-3.5-flash
    api_key_env: GEMINI_API_KEY
    temperature: 1
    request_extra:
      use_default_temperature: true
      thinking_config: {thinking_budget: 0}
    max_tokens: 512
    max_retries: 3
    timeout_seconds: 60
  - name: gemini_pro_preview
    provider: gemini
    model: gemini-3.1-pro-preview
    api_key_env: GEMINI_API_KEY
    temperature: 1
    request_extra:
      use_default_temperature: true
      thinking_config: {thinking_level: low}
    max_tokens: 4096
    max_retries: 3
    timeout_seconds: 120

agents: [direct]
environments:
  - {name: bayesian_games, num_tasks: 20, seed: 123}
  - {name: auctions, num_tasks: 20, seed: 123}
  - {name: hidden_regimes, num_tasks: 20, seed: 123}
  - {name: market_making, num_tasks: 20, seed: 123}
  - {name: prediction_markets, num_tasks: 20, seed: 123}
  - {name: adversarial_risk, num_tasks: 20, seed: 123}
robustness: {enabled: false}
reporting: {write_jsonl: true, write_summary: true, write_markdown: false}

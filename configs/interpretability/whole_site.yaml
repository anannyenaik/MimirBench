# Whole-site causal interventions on the medium checkpoint.
run:
  name: interp_bayes_all_medium
  seed: 123
  output_dir: runs/interpretability/whole_site

model:
  checkpoint_path: runs/training/medium/checkpoints/best.pt
  vocab_path: runs/training/medium/vocab.json
  device: cpu

data:
  source: synthetic
  num_examples: 256
  num_pairs: 128
  seed: 123
  num_hypotheses: 2
  min_observations: 2
  max_observations: 10
  signal_reliability: 0.75
  posterior_buckets: 20
  payoff:
    reward_if_A: 1.0
    loss_if_not_A: 1.0
    decision_cost: 0.0
    risk_tolerance: 0.35

sites: null

experiments:
  probes: true
  activation_patching: true
  attention_analysis: true

batch_size: 32
max_examples: 64
alpha: 1.0

# Six independent training and causal-analysis seeds. Local and CPU-only.
run:
  name: interp_bayes_medium_multiseed
  summary_dir: runs/interpretability

seeds: [123, 124, 125, 126, 127, 128]

train_template: configs/training/medium.yaml
interp_template: configs/interpretability/whole_site.yaml
extended_template: configs/interpretability/controls.yaml

training_output_template: runs/training/medium_seed_{seed}
interp_output_template: runs/interpretability/whole_site_seed_{seed}
extended_output_template: runs/interpretability/controls_seed_{seed}
eval_output_template: runs/interpretability/heldout_eval_seed_{seed}

seed_overrides:
  123:
    training_dir: runs/training/medium
    interp_dir: runs/interpretability/whole_site
    extended_dir: runs/interpretability/controls

skip_existing: true
run_full_interpretability: true
run_extended_interpretability: true
run_heldout_eval: true
heldout_num_tasks: 2000
heldout_seed_base: 900000

device: cpu

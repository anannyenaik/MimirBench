run:
  name: market_making_reference_smoke
  seed: 123
  output_dir: reports/runs/market_making_reference_smoke
  cache: true
  max_workers: 1

agent:
  type: reference

environments:
  - name: market_making
    num_tasks: 50
    seed: 123

reporting:
  write_jsonl: true
  write_summary: true
  write_markdown: true
  metrics:
    - mean_score
    - quote_validity
    - inventory_risk_score
    - risk_limit_violation
    - adverse_selection_penalty
    - invalid_response_rate

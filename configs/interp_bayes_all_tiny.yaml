# Stage 8 interpretability: run all experiments on the tiny Bayesian checkpoint.
# Deterministic, CPU-only, no downloads. Requires the trained checkpoint and the
# "ml" extra (torch). If either is missing the runner writes a "pending" report.
run:
  name: interp_bayes_all_tiny
  seed: 123
  output_dir: reports/interpretability/interp_bayes_all_tiny

model:
  checkpoint_path: reports/training/small_transformer_bayes_tiny/checkpoints/best.pt
  vocab_path: reports/training/small_transformer_bayes_tiny/vocab.json
  device: cpu

data:
  source: synthetic
  num_examples: 96
  num_pairs: 48
  seed: 123
  num_hypotheses: 2
  min_observations: 1
  max_observations: 6
  signal_reliability: 0.7
  posterior_buckets: 20
  payoff:
    reward_if_A: 1.0
    loss_if_not_A: 1.0
    decision_cost: 0.0
    risk_tolerance: 0.35

# Patch / capture sites. Omit to use every site the model exposes
# (embed, then attn_out / mlp_out / resid_post per block).
sites: null

experiments:
  probes: true
  activation_patching: true
  attention_analysis: true

batch_size: 16
max_examples: 48
alpha: 1.0

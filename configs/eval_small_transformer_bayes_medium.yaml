# Held-out evaluation of the medium Bayesian checkpoint.
# The eval seed (20000) is disjoint from the training seed (123) and uses the
# "test" split generator, so these tasks were never seen during training.
run:
  name: small_transformer_bayes_medium_eval
  seed: 20000
  output_dir: reports/runs/small_transformer_bayes_medium_eval

checkpoint_path: reports/training/small_transformer_bayes_medium/checkpoints/best.pt
device: cpu

data:
  num_tasks: 2000
  min_observations: 2
  max_observations: 10
  num_hypotheses: 2
  signal_reliability: 0.75
  posterior_buckets: 20
  payoff:
    reward_if_A: 1.0
    loss_if_not_A: 1.0
    decision_cost: 0.0
    risk_tolerance: 0.35

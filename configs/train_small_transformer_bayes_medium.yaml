# Medium training run: a stronger synthetic Bayesian/risk transformer.
#
# Goal: train a model that genuinely learns the evidence -> posterior -> action
# computation (unlike the undertrained tiny smoke model), so the
# interpretability patching experiments have a real computation to localise.
# CPU-only, deterministic (dropout 0, fixed seed), no downloads.
run:
  name: small_transformer_bayes_medium
  seed: 123
  output_dir: reports/training/small_transformer_bayes_medium

data:
  num_train: 12000
  num_val: 2000
  num_test: 2000
  # min 2 observations so evidence is always informative and clean/corrupted
  # counterfactual pairs are always buildable; richer evidence (up to 10 signals)
  # raises the evidence-token fraction so token-level effects survive mean pooling.
  min_observations: 2
  max_observations: 10
  num_hypotheses: 2
  signal_reliability: 0.75
  posterior_buckets: 20
  payoff:
    reward_if_A: 1.0
    loss_if_not_A: 1.0
    decision_cost: 0.0
    risk_tolerance: 0.35

model:
  d_model: 128
  n_layers: 2
  n_heads: 4
  dim_feedforward: 256
  dropout: 0.0
  max_seq_len: 128
  lm_loss_weight: 0.0

training:
  batch_size: 64
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  device: cpu
  early_stopping_patience: 5

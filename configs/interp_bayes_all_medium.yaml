# Stage 8 interpretability on the medium Bayesian checkpoint.
# Runs probes, activation patching, and attention analysis on the model trained
# by configs/train_small_transformer_bayes_medium.yaml. Deterministic, CPU-only,
# no downloads. If the checkpoint or torch is missing the runner writes a
# "pending" report rather than failing.
run:
  name: interp_bayes_all_medium
  seed: 123
  output_dir: reports/interpretability/interp_bayes_all_medium

model:
  checkpoint_path: reports/training/small_transformer_bayes_medium/checkpoints/best.pt
  vocab_path: reports/training/small_transformer_bayes_medium/vocab.json
  device: cpu

data:
  source: synthetic
  num_examples: 256
  num_pairs: 128
  seed: 123
  num_hypotheses: 2
  min_observations: 2
  max_observations: 10
  signal_reliability: 0.75
  posterior_buckets: 20
  payoff:
    reward_if_A: 1.0
    loss_if_not_A: 1.0
    decision_cost: 0.0
    risk_tolerance: 0.35

# Patch / capture sites. null => every site the model exposes
# (embed, then attn_out / mlp_out / resid_post per block).
sites: null

experiments:
  probes: true
  activation_patching: true
  attention_analysis: true

batch_size: 32
max_examples: 64
alpha: 1.0
